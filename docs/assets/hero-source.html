<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, initial-scale=1" />
    <title>Study Bench hero</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1600px; height: 720px; margin: 0; overflow: hidden; }
      body {
        color: #f8fbff;
        background:
          radial-gradient(circle at 74% 10%, rgba(63, 130, 246, .32), transparent 32%),
          linear-gradient(135deg, #07162f 0%, #0b2651 55%, #123e74 100%);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .canvas { position: relative; width: 100%; height: 100%; isolation: isolate; }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(121, 170, 255, .07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(121, 170, 255, .07) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(90deg, #000, rgba(0,0,0,.65), transparent 88%);
      }
      .axis { position: absolute; left: 68px; bottom: 62px; width: 710px; height: 112px; opacity: .58; }
      .axis::before, .axis::after { content: ""; position: absolute; background: rgba(126, 176, 255, .45); }
      .axis::before { left: 0; bottom: 21px; width: 100%; height: 1px; }
      .axis::after { left: 0; bottom: 21px; width: 1px; height: 82px; }
      .point { position: absolute; bottom: 17px; width: 9px; height: 9px; border-radius: 50%; background: #7cb2ff; box-shadow: 0 0 0 4px rgba(124,178,255,.12); }
      .p1 { left: 92px; } .p2 { left: 198px; } .p3 { left: 315px; } .p4 { left: 448px; } .p5 { left: 602px; }
      .sequence { position: absolute; bottom: 0; left: 87px; letter-spacing: 82px; color: #9dc3ff; font: 600 13px/1 ui-monospace, monospace; white-space: nowrap; }
      .copy { position: absolute; z-index: 2; left: 92px; top: 116px; width: 660px; }
      .brand { margin: 0 0 30px; color: #82b5ff; font-size: 18px; font-weight: 750; letter-spacing: .24em; }
      h1 { margin: 0; max-width: 650px; font-size: 68px; line-height: 1.04; letter-spacing: -.045em; font-weight: 720; }
      .loop { margin: 30px 0 0; color: #cbdcff; font-size: 23px; letter-spacing: .025em; }
      .rule { width: 74px; height: 3px; margin-top: 40px; border-radius: 2px; background: #5a9df8; }
      .product {
        position: absolute; z-index: 2; top: 74px; right: -86px; width: 790px; height: 572px;
        overflow: hidden; border: 1px solid rgba(194, 220, 255, .42); border-radius: 22px;
        background: #f7f0e3; box-shadow: 0 42px 100px rgba(0, 5, 22, .56); transform: rotate(-1.2deg);
      }
      .product::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.36); pointer-events: none; }
      .product img { width: 100%; height: 100%; object-fit: cover; object-position: 29% 0%; display: block; }
      .corner { position: absolute; right: 54px; bottom: 32px; color: rgba(214,229,255,.68); font: 500 13px/1 ui-monospace, monospace; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="grid"></div>
      <section class="copy">
        <p class="brand">STUDY BENCH</p>
        <h1>Turn textbooks into guided learning.</h1>
        <p class="loop">Lecture · Question · Practice · Feedback.</p>
        <div class="rule"></div>
      </section>
      <div class="axis" aria-hidden="true">
        <i class="point p1"></i><i class="point p2"></i><i class="point p3"></i><i class="point p4"></i><i class="point p5"></i>
        <span class="sequence">1 2 3 4 n</span>
      </div>
      <figure class="product"><img src="./screenshots/learning-workbench.png" alt="Study Bench learning workbench" /></figure>
      <span class="corner">study-bench.vercel.app</span>
    </main>
  </body>
</html>
